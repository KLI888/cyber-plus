<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign In — Meridian General</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14232A; --ink-2: #1B2E37; --teal: #1F6F63; --amber: #E8A33D;
    --paper: #F4F7F5; --line: #2C4048; --muted: #9FB4AE;
  }
  * { box-sizing: border-box; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: var(--ink); color: var(--paper);
         display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: var(--ink-2); padding: 2.6rem 2.4rem; border-radius: 8px; width: 340px;
          box-shadow: 0 20px 50px rgba(0,0,0,.35); border: 1px solid var(--line); }
  .back { display: inline-block; margin-bottom: 1.4rem; font-size: .8rem; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--paper); }
  h1 { font-family: 'IBM Plex Serif', serif; font-size: 1.3rem; margin: 0 0 .25rem; font-weight: 500; }
  h1 span { color: var(--amber); }
  p.sub { color: var(--muted); font-size: .84rem; margin: 0 0 1.7rem; }
  label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: .3rem; }
  input { width: 100%; padding: .65rem .75rem; margin-bottom: 1rem; border-radius: 5px; border: 1px solid var(--line);
          background: var(--ink); color: var(--paper); box-sizing: border-box; font-family: inherit; font-size: .92rem; }
  input:focus { outline: none; border-color: var(--teal); }
  button { width: 100%; padding: .75rem; border: none; border-radius: 5px; background: var(--teal); color: #fff;
           font-weight: 600; cursor: pointer; font-size: .92rem; font-family: inherit; }
  button:hover { background: #164F46; }
  #msg { margin-top: .9rem; font-size: .82rem; color: #E8887A; min-height: 1.2em; }
  .footnote { margin-top: 1.4rem; font-size: .74rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 1rem; }
</style>
</head>
<body>
  <div class="card">
    <a class="back" href="/">← Back to Meridian General</a>
    <h1>Staff <span>Sign In</span></h1>
    <p class="sub">Admin, doctor, and staff access only.</p>
    <label for="username">Username</label>
    <input id="username" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button onclick="login()">Sign In</button>
    <div id="msg"></div>
    <div class="footnote">Every session is continuously re-verified. Suspicious activity ends access automatically.</div>
  </div>

<script>
async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  msg.textContent = '';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { msg.textContent = data.message || data.error || 'Login failed'; return; }
    localStorage.setItem('cp_access', data.access_token);
    localStorage.setItem('cp_refresh', data.refresh_token);
    localStorage.setItem('cp_user', JSON.stringify(data.user));
    window.location.href = '/dashboard';
  } catch (e) {
    msg.textContent = 'Network error';
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
